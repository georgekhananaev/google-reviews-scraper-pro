name: Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build the image and start Chrome in it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t google-reviews-scraper-pro .
      - name: Start Chrome and render a page (no network needed)
        run: >
          docker run --rm --network none --shm-size=1g --entrypoint python
          google-reviews-scraper-pro /app/docker/check_chrome.py
      - name: Write to a mounted folder as the current user
        run: |
          mkdir -p data
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/data:/data" google-reviews-scraper-pro db-stats
          test -f data/reviews.db
          test "$(stat -c %u data/reviews.db)" = "$(id -u)"
      - name: Start Chrome as the current user
        run: >
          docker run --rm --network none --shm-size=1g --user "$(id -u):$(id -g)" --entrypoint python
          google-reviews-scraper-pro /app/docker/check_chrome.py
      - name: Check the compose file
        run: docker compose config --quiet

  publish:
    name: Publish to ghcr.io
    # Only for version tags such as v1.4.0, and only after the image passed the test above.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
